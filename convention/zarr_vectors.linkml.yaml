id: https://raw.githubusercontent.com/Andrew-Keenlyside/zarr-vectors/refs/tags/v0.1.0/schema.json
name: zarr_vectors
title: Zarr Vectors Convention v0.1.0
version: 0.1.0
description: >-
  Validates one node's zarr.json under the Zarr Vectors convention v0.1.0
  (metadata for Zarr Vectors format 0.10.0). Every property lives under
  the single attribute key `zarr_vectors`, discriminated by `kind`. Rules
  that span several nodes (axis counts, bin divisibility, the parent_level
  chain, link offsets) are listed in the convention README and are not
  checked here. GENERATED by convention/build.py from
  convention/zarr_vectors.linkml.yaml in AllenInstitute/zarr_vectors; edit
  the LinkML source there, not schema.json.
license: BSD-3-Clause

# How this file becomes schema.json
# ---------------------------------
# build.py runs LinkML's JSON Schema generator with
# include_range_class_descendants (so `zarr_vectors` is any of the concrete
# kind classes, each pinning `kind`) and then applies the `json_schema`
# annotations below.  An annotation maps fragment names to JSON Schema the generator cannot
# emit from LinkML (LinkML 1.x has no "array contains an object matching X",
# no boolean equality in rule conditions, no "null or absent" postcondition
# and no exclusive bounds).  The fragments go into the class's `allOf` in
# order.  Two generator quirks shape the rules: a rule
# that forbids several slots is emitted as "not all of them together", so
# each forbidden slot gets its own rule; and a `range` in a postcondition is
# dropped, so value sets are spelled with `equals_string_in`.
#
# Optional slots do not accept JSON `null` (the generator runs with
# include_null=False).  A slot annotated `nullable: true` (in a class's
# slot_usage) does: build.py adds "null" to that property's type.  Each annotation is appended to its class's
# `allOf`; keep them to those gaps and say in the comment which gap it fills.

prefixes:
  linkml: https://w3id.org/linkml/
  zv: https://w3id.org/zarr-vectors/0.10/
default_prefix: zv
default_range: string
imports:
  - linkml:types

# ---------------------------------------------------------------------------
# Kind sets, reused by the node-level rules (YAML anchors).
# ---------------------------------------------------------------------------
# group kinds:     root level links_family link_attribute_family object_index parametric
# array kinds:     vertices vertex_fragments link_fragments links vertex_attribute
#                  fragment_attribute link_attribute object_attribute groups
#                  group_attribute parametric_objects parametric_names
# vlen kinds:      per-chunk arrays + groups + parametric_names
# per-chunk kinds: vertices vertex_fragments link_fragments links
#                  vertex_attribute fragment_attribute link_attribute

enums:
  VolumeElement:
    description: Volume-mesh cells, vertices in VTK order.
    permissible_values:
      tetra: {description: 4 vertices; 0-1-2 faces vertex 3 by the right-hand rule.}
      pyramid: {description: 5 vertices; base quad 0-3 faces the apex 4.}
      wedge: {description: 6 vertices; triangle 0-1-2 faces away from 3-4-5.}
      hexahedron: {description: 8 vertices; quad 0-3 faces quad 4-7.}

  LinkElement:
    description: A links family's `element`.
    permissible_values:
      tetra:
      pyramid:
      wedge:
      hexahedron:
      mixed: {description: Several element types; see `element_types`.}

  NodeType:
    permissible_values:
      array:
      group:

  ZarrVectorsKind:
    description: What a node is.  An unknown kind MUST be rejected.
    permissible_values:
      root: {description: The store root group.}
      level: {description: "A resolution level group, `<N>/`."}
      vertices: {description: "`<N>/vertices`: per-chunk vertex positions."}
      vertex_fragments: {description: "`<N>/vertex_fragments`: per-chunk fragment index over the vertices."}
      link_fragments: {description: "`<N>/link_fragments`: per-chunk fragment index over the intra-chunk links."}
      links_family: {description: "`<N>/links/<delta>/`: family-wide link policy."}
      links: {description: "`<N>/links/<delta>/<offsets>`: per-chunk link records."}
      vertex_attribute: {description: "`<N>/vertex_attributes/<name>`: per-chunk vertex attribute rows."}
      fragment_attribute: {description: "`<N>/fragment_attributes/<name>`: per-chunk fragment attribute rows."}
      link_attribute_family: {description: "`<N>/link_attributes/<name>/<delta>/`."}
      link_attribute: {description: "`<N>/link_attributes/<name>/<delta>/<offsets>`: rows aligned with a links array."}
      object_index: {description: "`<N>/object_index/`: object id to fragment manifests."}
      object_attribute: {description: "`<N>/object_attributes/<name>`: one row per object."}
      groups: {description: "`<N>/groups`: object groupings."}
      group_attribute: {description: "`<N>/group_attributes/<name>`: one row per group."}
      parametric: {description: "`parametric/`: parametric objects (planes, spheres, ...)."}
      parametric_objects: {description: "`parametric/objects`: coefficient rows."}
      parametric_names: {description: "`parametric/names`: object names."}

  VlenDataType:
    description: >-
      The zarr-extensions `bytes` data type.  zarr-python 3.x writes it as
      `variable_length_bytes`.
    permissible_values:
      bytes:
      variable_length_bytes:

  VertexEncoding:
    permissible_values:
      raw: {description: Little-endian rows of `dtype`.}
      draco: {description: Google Draco compression.}

  LinksConvention:
    description: How intra-chunk links are represented.
    permissible_values:
      explicit: {description: "An explicit `links` array is written."}
      implicit_sequential: {description: Vertex order encodes the polyline; no links array.}
      implicit_sequential_with_branches: {description: Implicit sequential plus a branch list (skeletons).}

  ObjectIndexConvention:
    permissible_values:
      standard: {description: "An `object_index` maps each object to its fragments."}
      identity: {description: "One object per vertex, single-chunk stores only."}

  CrossChunkStrategy:
    permissible_values:
      explicit_links: {description: Links with non-zero offsets bridge chunk boundaries.}
      boundary_deduplication: {description: Boundary vertices are duplicated in each chunk.}
      both:

  CrossLevelStorage:
    permissible_values:
      none: {description: No cross-level link arrays.}
      implicit: {description: Only positive deltas are stored; negative ones are derived on read.}
      explicit: {description: Both positive and negative deltas are stored.}

  ManifestLayout:
    description: Writer default for new object indexes.
    permissible_values:
      vlen:
      dense:

  ManifestBlockDtype:
    permissible_values:
      int64:
      int32:

  ObjectIndexLayout:
    permissible_values:
      vlen_manifests_v1: {description: One vlen manifest per object; rows are object ids.}
      vlen_manifests_v2: {description: "One vlen manifest per object; ids in `object_ids`."}
      dense_manifests_v1: {description: "`manifest_spans` into `manifest_blocks`; ids in `object_ids`."}

  CrossChunkStore:
    permissible_values:
      canonical: {description: Each record is filed in exactly one cell.}
      duplicate: {description: Each record is filed once per distinct incident chunk.}

  CoarseningMethod:
    permissible_values:
      per_object:
      manual:
      none:

  PresenceState:
    permissible_values:
      deferred:
        description: >-
          The level's per-chunk arrays do not yet carry `nonempty_chunks`;
          a reader lists the store instead.

  LevelArrayName:
    permissible_values:
      vertices:
      vertex_fragments:
      link_fragments:
      links:
      vertex_attributes:
      fragment_attributes:
      link_attributes:
      object_index:
      object_attributes:
      groups:
      group_attributes:

classes:

  # =========================================================================
  # The zarr.json document
  # =========================================================================

  ZarrNode:
    tree_root: true
    description: >-
      One node's zarr.json (Zarr v3).  Only the fields this convention
      constrains are modelled; everything else in zarr.json is allowed.
    extra_slots: {allowed: true}
    attributes:
      zarr_format: {range: integer, required: true, equals_number: 3}
      node_type: {range: NodeType, required: true}
      data_type:
        description: >-
          Zarr's own data type field (arrays only).  Constrained only for the
          vlen kinds, by the rule below.
        range: OpenValue
      codecs:
        description: Zarr codec pipeline (arrays only).
        range: Codec
        multivalued: true
        inlined_as_list: true
      attributes: {range: NodeAttributes, required: true, inlined: true}
    rules:
      - description: Group kinds are Zarr groups.
        preconditions:
          slot_conditions:
            attributes:
              range_expression:
                slot_conditions:
                  zarr_vectors:
                    range_expression:
                      slot_conditions:
                        kind:
                          equals_string_in: &group_kinds
                            [root, level, links_family, link_attribute_family, object_index, parametric]
        postconditions:
          slot_conditions:
            node_type: {equals_string: group}
      - description: Array kinds are Zarr arrays.
        preconditions:
          slot_conditions:
            attributes:
              range_expression:
                slot_conditions:
                  zarr_vectors:
                    range_expression:
                      slot_conditions:
                        kind:
                          equals_string_in: &array_kinds
                            [vertices, vertex_fragments, link_fragments, links, vertex_attribute,
                             fragment_attribute, link_attribute, object_attribute, groups,
                             group_attribute, parametric_objects, parametric_names]
        postconditions:
          slot_conditions:
            node_type: {equals_string: array}
      - description: >-
          Per-chunk arrays, `groups` and `parametric_names` use the `bytes`
          data type (each cell is one variable-length blob).
        preconditions:
          slot_conditions:
            attributes:
              range_expression:
                slot_conditions:
                  zarr_vectors:
                    range_expression:
                      slot_conditions:
                        kind:
                          equals_string_in: &vlen_kinds
                            [vertices, vertex_fragments, link_fragments, links, vertex_attribute,
                             fragment_attribute, link_attribute, groups, parametric_names]
        postconditions:
          slot_conditions:
            data_type: {equals_string_in: [bytes, variable_length_bytes]}
            codecs: {required: true}
      - description: The root registers the multiscales convention and carries its block.
        preconditions:
          slot_conditions:
            attributes:
              range_expression:
                slot_conditions:
                  zarr_vectors:
                    range_expression:
                      slot_conditions:
                        kind: {equals_string: root}
        postconditions:
          slot_conditions:
            attributes:
              range_expression:
                slot_conditions:
                  multiscales: {required: true}
    annotations:
      json_schema:
        value:
          # gap: "array contains an object matching X" (nested codec lists).
          vlen_bytes_codec:
            description: >-
              The cells of a vlen kind are encoded by the `vlen-bytes` codec,
              directly or as the cell codec of a sharding codec
              (sharding_indexed, octree).
            if:
              type: object
              properties:
                attributes:
                  properties:
                    zarr_vectors:
                      properties:
                        kind:
                          enum: *vlen_kinds
                      required: [kind]
                  required: [zarr_vectors]
              required: [attributes]
            then:
              type: object
              properties:
                codecs:
                  anyOf:
                    - type: array
                      contains: {$ref: "#/$defs/VlenBytesCodec"}
                    - type: array
                      contains:
                        type: object
                        properties:
                          configuration:
                            type: object
                            properties:
                              codecs:
                                type: array
                                contains: {$ref: "#/$defs/VlenBytesCodec"}
                            required: [codecs]
                        required: [configuration]
          # gap: "array contains an object matching X" (the convention registry).
          multiscales_registered:
            description: The root registers the multiscales convention by uuid.
            if:
              type: object
              properties:
                attributes:
                  properties:
                    zarr_vectors:
                      properties:
                        kind: {const: root}
                      required: [kind]
                  required: [zarr_vectors]
              required: [attributes]
            then:
              type: object
              properties:
                attributes:
                  properties:
                    zarr_conventions:
                      contains:
                        type: object
                        properties:
                          uuid: {const: d35379db-88df-4056-af3a-620245f8e347}
                        required: [uuid]

  Codec:
    extra_slots: {allowed: true}
    attributes:
      name: {required: true}
      configuration: {range: CodecConfiguration, inlined: true}

  CodecConfiguration:
    description: A codec's configuration; only a sharding codec's inner `codecs` is modelled.
    extra_slots: {allowed: true}
    attributes:
      codecs: {range: Codec, multivalued: true, inlined_as_list: true}

  VlenBytesCodec:
    extra_slots: {allowed: true}
    attributes:
      name: {required: true, equals_string: vlen-bytes}

  NodeAttributes:
    description: >-
      The node's `attributes`.  Other keys (other conventions' keys such
      as `proj:projjson`, `user_metadata`) are allowed and ignored.
    extra_slots: {allowed: true}
    attributes:
      zarr_conventions:
        description: >-
          Convention registrations.  Exactly one entry identifies Zarr
          Vectors; any entry carrying its uuid or name must match in full.
        range: ConventionEntry
        multivalued: true
        inlined_as_list: true
        required: true
      zarr_vectors:
        description: The single nesting key.  `kind` says what the node is.
        range: ZarrVectorsBlock
        inlined: true
        required: true
      multiscales:
        range: Multiscales
        inlined: true
    annotations:
      json_schema:
        value:
          # gap: "contains an object matching X", maxContains, and a closed
          # object only when the entry is ours.
          zarr_vectors_registration:
            properties:
              zarr_conventions:
                contains: {$ref: "#/$defs/ZarrVectorsConventionMetadata"}
                maxContains: 1
                items:
                  if:
                    type: object
                    anyOf:
                      - {type: object, properties: {uuid: {const: 66268a61-7833-4995-bbcb-233bb417dae5}}, required: [uuid]}
                      - {type: object, properties: {name: {const: zarr_vectors}}, required: [name]}
                  then: {$ref: "#/$defs/ZarrVectorsConventionMetadata"}

  ConventionEntry:
    description: One Convention Metadata Object (any convention).
    extra_slots: {allowed: true}
    attributes:
      uuid: {}
      name: {}
      schema_url: {}
      spec_url: {}
      description: {}

  ZarrVectorsConventionMetadata:
    description: >-
      The Convention Metadata Object for the Zarr Vectors convention v0.1.0.  On non-root
      nodes the uuid alone is enough.
    extra_slots: {allowed: false}
    any_of:
      - slot_conditions: {schema_url: {required: true}}
      - slot_conditions: {spec_url: {required: true}}
      - slot_conditions: {uuid: {required: true}}
    attributes:
      schema_url: {equals_string: "https://raw.githubusercontent.com/Andrew-Keenlyside/zarr-vectors/refs/tags/v0.1.0/schema.json"}
      spec_url: {equals_string: "https://github.com/Andrew-Keenlyside/zarr-vectors/blob/v0.1.0/README.md"}
      uuid: {equals_string: 66268a61-7833-4995-bbcb-233bb417dae5}
      name: {equals_string: zarr_vectors}
      description: {equals_string: "Spatially chunked, multi-resolution N-dimensional vector data (point clouds, meshes, skeletons, streamlines, graphs)"}

  Multiscales:
    description: >-
      The registered multiscales convention's block
      (zarr-conventions/multiscales v0.1): one `{"asset": "<level>"}` entry
      per resolution level, "0" included.  Vertex coordinates are the same
      at every level, so an entry carries no transform, or only the
      identity.  Bin geometry is the root `base_bin_shape` (level 0) and
      each coarse level's own `bin_shape` / `bin_ratio`.
    extra_slots: {allowed: true}
    attributes:
      layout:
        range: MultiscaleEntry
        multivalued: true
        inlined_as_list: true
        required: true
        minimum_cardinality: 1
    annotations:
      json_schema:
        value:
          # gap: "array contains an object matching X".
          level_0_listed:
            properties:
              layout:
                contains:
                  type: object
                  properties:
                    asset: {const: "0"}
                  required: [asset]

  MultiscaleEntry:
    extra_slots: {allowed: true}
    attributes:
      asset: {required: true, pattern: "^[0-9]+$", description: "A level group's name."}
      transform: {range: IdentityTransform, inlined: true}

  IdentityTransform:
    description: Only the identity is allowed.
    extra_slots: {allowed: true}
    attributes:
      scale: {range: float, multivalued: true, minimum_value: 1, maximum_value: 1}
      translation: {range: float, multivalued: true, minimum_value: 0, maximum_value: 0}

  # =========================================================================
  # The `zarr_vectors` block, one class per kind
  # =========================================================================

  ZarrVectorsBlock:
    abstract: true
    description: >-
      Fields depend on `kind`.  Unknown fields are allowed and SHOULD be
      ignored.
    extra_slots: {allowed: true}
    slots: [kind]
    rules:
      - description: Only per-chunk arrays carry `nonempty_chunks`.
        preconditions:
          slot_conditions:
            kind:
              equals_string_in: &non_per_chunk_kinds
                [root, level, links_family, link_attribute_family, object_index, object_attribute,
                 groups, group_attribute, parametric, parametric_objects, parametric_names]
        postconditions:
          slot_conditions:
            nonempty_chunks: {value_presence: ABSENT}
      - description: Only per-chunk arrays carry `chunk_grid_origin`.
        preconditions:
          slot_conditions:
            kind:
              equals_string_in: *non_per_chunk_kinds
        postconditions:
          slot_conditions:
            chunk_grid_origin: {value_presence: ABSENT}

  PerChunkArray:
    mixin: true
    description: An array with one cell per chunk of the level's grid.
    slots: [nonempty_chunks, chunk_grid_origin]

  RootMetadata:
    is_a: ZarrVectorsBlock
    extra_slots: {allowed: true}
    slots:
      - zv_version
      - axes
      - chunk_shape
      - bounds
      - geometry_types
      - links_convention
      - object_index_convention
      - cross_chunk_strategy
      - reduction_factor
      - base_bin_shape
      - cross_level_depth
      - cross_level_storage
      - format_capabilities
      - required_capabilities
      - attribute_specs
      - shard_shape
      - octree_sharding
      - manifest_layout
      - manifest_block_dtype
      - coordinate_offset
    slot_usage:
      kind: {equals_string: root}
      zv_version: {required: true}
      axes: {required: true}
      chunk_shape: {required: true}
      bounds: {required: true}
      geometry_types: {required: true}
    rules:
      - description: "A CRS is the proj convention's `proj:projjson` beside this block."
        preconditions:
          slot_conditions:
            kind: {equals_string: root}
        postconditions:
          slot_conditions:
            crs: {value_presence: ABSENT}
      - description: "Level parents are each level's `parent_level`."
        preconditions:
          slot_conditions:
            kind: {equals_string: root}
        postconditions:
          slot_conditions:
            parent_level: {value_presence: ABSENT}
      - description: Octree sharding needs a shard shape.
        preconditions:
          slot_conditions:
            octree_sharding: {value_presence: PRESENT}
        postconditions:
          slot_conditions:
            shard_shape: {required: true}
    annotations:
      json_schema:
        value:
          # gap: "array contains an object matching X".
          space_axis:
            properties:
              axes:
                contains:
                  type: object
                  properties:
                    type: {const: space}
                  required: [type]
          # gap: exclusive bounds.
          positive_sizes:
            properties:
              chunk_shape: {items: {exclusiveMinimum: 0}}
              base_bin_shape: {items: {exclusiveMinimum: 0}}

  LevelMetadata:
    is_a: ZarrVectorsBlock
    extra_slots: {allowed: true}
    slots:
      - level
      - vertex_count
      - arrays_present
      - fragments_tile
      - chunk_shape
      - object_sparsity
      - coarsening_method
      - chunk_dims
      - chunk_attribute_name
      - chunk_attribute_values
      - preserves_object_ids
      - inherited_num_objects
      - shared_fragments
      - parent_level
      - bin_shape
      - bin_ratio
      - presence
      - link_fragments_aligned
      - octree_chunks
    slot_usage:
      kind: {equals_string: level}
      level: {required: true}
      # `null` means "not set" for these (writers emit it at level 0 and
      # for levels without attribute chunking).
      chunk_shape: {annotations: {nullable: true}}
      chunk_dims: {annotations: {nullable: true}}
      chunk_attribute_name: {annotations: {nullable: true}}
      chunk_attribute_values: {annotations: {nullable: true}}
      inherited_num_objects: {annotations: {nullable: true}}
      parent_level: {annotations: {nullable: true}}
      bin_shape: {annotations: {nullable: true}}
      bin_ratio: {annotations: {nullable: true}}
    rules:
      - description: Bounds are root-only.
        preconditions:
          slot_conditions:
            kind: {equals_string: level}
        postconditions:
          slot_conditions:
            bounds: {value_presence: ABSENT}
    annotations:
      json_schema:
        value:
          # gap: boolean equality in a rule condition.
          preserved_ids_record_inherited_count:
            description: An id-preserving level records the OID space it inherits.
            if:
              type: object
              properties:
                preserves_object_ids: {const: true}
              required: [preserves_object_ids]
            then:
              type: object
              required: [inherited_num_objects]
          # gap: boolean equality, and "null or absent", in a rule postcondition.
          level_0:
            description: >-
              Level 0's bin is the root `base_bin_shape`; it has no parent and
              preserves no ids.
            if:
              type: object
              properties:
                level: {const: 0}
              required: [level]
            then:
              type: object
              properties:
                preserves_object_ids: {const: false}
                parent_level: {type: "null"}
                bin_shape: {type: "null"}
                bin_ratio: {type: "null"}
          # gap: exclusive bounds.
          positive_sizes:
            properties:
              chunk_shape: {type: [array, "null"], items: {exclusiveMinimum: 0}}
              bin_shape: {type: [array, "null"], items: {exclusiveMinimum: 0}}
              bin_ratio: {type: [array, "null"], items: {exclusiveMinimum: 0}}
              object_sparsity: {exclusiveMinimum: 0}

  VerticesMetadata:
    is_a: ZarrVectorsBlock
    mixins: [PerChunkArray]
    extra_slots: {allowed: true}
    slots: [dtype, encoding, compression_codec, shape]
    slot_usage:
      kind: {equals_string: vertices}
      dtype: {required: true}
      encoding: {required: true, range: VertexEncoding}

  FragmentIndexMetadata:
    is_a: ZarrVectorsBlock
    mixins: [PerChunkArray]
    description: Fragment index over a level's vertices or intra-chunk links.
    extra_slots: {allowed: true}
    slots: [encoding]
    slot_usage:
      kind: {equals_string_in: [vertex_fragments, link_fragments]}
      encoding: {required: true, equals_string: fragment_index_v1}

  LinksFamilyMetadata:
    is_a: ZarrVectorsBlock
    description: >-
      A `links/<delta>/` group: the policy every offsets array beneath it
      decodes against.
    extra_slots: {allowed: true}
    slots: [level_delta, link_width, sid_ndim, directed, store, num_links, num_physical_records,
            element, element_types]
    slot_usage:
      kind: {equals_string: links_family}
      level_delta: {required: true}
      link_width: {required: true}
      directed: {required: true}
      store: {required: true}
    rules:
      - description: A `tetra` family's records are 4 wide.
        preconditions:
          slot_conditions:
            element: {equals_string: tetra}
        postconditions:
          slot_conditions:
            link_width: {equals_number: 4}
      - description: A `pyramid` family's records are 5 wide.
        preconditions:
          slot_conditions:
            element: {equals_string: pyramid}
        postconditions:
          slot_conditions:
            link_width: {equals_number: 5}
      - description: A `wedge` family's records are 6 wide.
        preconditions:
          slot_conditions:
            element: {equals_string: wedge}
        postconditions:
          slot_conditions:
            link_width: {equals_number: 6}
      - description: A `hexahedron` family's records are 8 wide.
        preconditions:
          slot_conditions:
            element: {equals_string: hexahedron}
        postconditions:
          slot_conditions:
            link_width: {equals_number: 8}
      - description: A mixed family lists its element types.
        preconditions:
          slot_conditions:
            element: {equals_string: mixed}
        postconditions:
          slot_conditions:
            element_types: {required: true}
      - description: Volume elements join the vertices of one level (delta 0).
        preconditions:
          slot_conditions:
            element: {equals_string_in: [tetra, pyramid, wedge, hexahedron, mixed]}
        postconditions:
          slot_conditions:
            level_delta: {equals_number: 0}

  LinksMetadata:
    is_a: ZarrVectorsBlock
    mixins: [PerChunkArray]
    description: One `links/<delta>/<offsets>` array; a cell holds the records whose source chunk it is.
    extra_slots: {allowed: true}
    slots: [dtype, offsets, has_perm, link_width, level_delta]
    slot_usage:
      kind: {equals_string: links}
      dtype: {required: true}
      offsets: {required: true}
      has_perm: {required: true}
      link_width: {required: true}
      level_delta: {required: true}

  RowAttributeMetadata:
    is_a: ZarrVectorsBlock
    abstract: true
    mixins: [PerChunkArray]
    description: Per-chunk attribute rows aligned with vertices, fragments or links.
    extra_slots: {allowed: true}
    slots: [name, dtype, row_shape, channel_names, channel_dtype]
    slot_usage:
      name: {required: true}
      dtype: {required: true}

  VertexAttributeMetadata:
    is_a: RowAttributeMetadata
    extra_slots: {allowed: true}
    slot_usage:
      kind: {equals_string: vertex_attribute}
      row_shape: {required: true}

  FragmentAttributeMetadata:
    is_a: RowAttributeMetadata
    extra_slots: {allowed: true}
    slot_usage:
      kind: {equals_string: fragment_attribute}
      row_shape: {required: true}

  LinkAttributeMetadata:
    is_a: RowAttributeMetadata
    description: >-
      Mirrors the `links/<delta>/<offsets>` array of the same delta and
      offsets cell for cell.  `row_shape` is absent on an array created
      empty.
    extra_slots: {allowed: true}
    slots: [offsets, level_delta]
    slot_usage:
      kind: {equals_string: link_attribute}
      offsets: {required: true}
      level_delta: {required: true}

  LinkAttributeFamilyMetadata:
    is_a: ZarrVectorsBlock
    extra_slots: {allowed: true}
    slots: [name, level_delta, num_links]
    slot_usage:
      kind: {equals_string: link_attribute_family}
      name: {required: true}
      level_delta: {required: true}

  ObjectIndexMetadata:
    is_a: ZarrVectorsBlock
    description: >-
      An index created before any object is written MAY carry only `kind`;
      once it holds manifests, `num_objects`, `sid_ndim` and `layout` MUST
      be present (not checked here).
    extra_slots: {allowed: true}
    slots: [num_objects, num_present, sid_ndim, layout, object_ids_sorted]
    slot_usage:
      kind: {equals_string: object_index}

  ObjectAttributeMetadata:
    is_a: ZarrVectorsBlock
    extra_slots: {allowed: true}
    slots: [name, dtype, shape, channel_names, fill_sentinel_meaning]
    slot_usage:
      kind: {equals_string: object_attribute}
      name: {required: true}
      dtype: {required: true}

  GroupsMetadata:
    is_a: ZarrVectorsBlock
    extra_slots: {allowed: true}
    slots: [num_groups, group_ranges]
    slot_usage:
      kind: {equals_string: groups}
      num_groups: {required: true}
    annotations:
      json_schema:
        value:
          # gap: a map whose values are not objects.
          group_ranges_pairs:
            properties:
              group_ranges:
                patternProperties:
                  "^[0-9]+$": {type: array, items: {type: integer, minimum: 0}, minItems: 2, maxItems: 2}
                additionalProperties: false

  GroupAttributeMetadata:
    is_a: ZarrVectorsBlock
    extra_slots: {allowed: true}
    slots: [name, dtype, shape, channel_names]
    slot_usage:
      kind: {equals_string: group_attribute}
      name: {required: true}
      dtype: {required: true}

  ParametricMetadata:
    is_a: ZarrVectorsBlock
    extra_slots: {allowed: true}
    slots: [parametric_types]
    slot_usage:
      kind: {equals_string: parametric}

  ParametricArrayMetadata:
    is_a: ZarrVectorsBlock
    extra_slots: {allowed: true}
    slots: [num_objects, max_row_length, dtype]
    slot_usage:
      kind: {equals_string_in: [parametric_objects, parametric_names]}
      num_objects: {required: true}

  # =========================================================================
  # Substructures
  # =========================================================================

  Axis:
    description: One coordinate axis, as in OME-Zarr RFC 4/5.
    extra_slots: {allowed: true}
    attributes:
      name: {required: true, pattern: ".+"}
      type: {required: true, pattern: ".+", description: '"space", "time", "channel" or a custom type.'}
      unit: {pattern: ".+"}

  AttributeSpecs:
    description: Declared attributes, keyed by scope and then by attribute name.
    extra_slots: {allowed: false}
    attributes:
      vertex: {range: AttributeSpec, multivalued: true, inlined: true, inlined_as_list: false}
      fragment: {range: AttributeSpec, multivalued: true, inlined: true, inlined_as_list: false}
      link: {range: AttributeSpec, multivalued: true, inlined: true, inlined_as_list: false}
      object: {range: AttributeSpec, multivalued: true, inlined: true, inlined_as_list: false}
      group: {range: AttributeSpec, multivalued: true, inlined: true, inlined_as_list: false}

  AttributeSpec:
    extra_slots: {allowed: true}
    attributes:
      attribute_name: {identifier: true, description: "The key: the attribute's name."}
      dtype: {pattern: ".+"}
      unit: {}

  ParametricType:
    extra_slots: {allowed: true}
    attributes:
      type_id: {identifier: true, pattern: "^[0-9]+$", description: "The key: the type id stored in each object row."}
      name: {required: true, pattern: ".+"}
      coefficients: {multivalued: true, required: true, description: "Coefficient names, in row order."}

  OpenObject:
    description: A JSON object whose contents this convention does not constrain.
    extra_slots: {allowed: true}

  OpenValue:
    description: Any JSON value (a bin label is a string or a number).
    class_uri: linkml:Any

slots:

  kind:
    description: What the node is.
    range: ZarrVectorsKind
    required: true

  # -- per-chunk ------------------------------------------------------------
  nonempty_chunks:
    description: >-
      Keys of the chunks that hold data.  A cache: a reader that finds it
      absent lists the store instead.
    multivalued: true
    pattern: "^-?[0-9]+(\\.-?[0-9]+)*$"
  chunk_grid_origin:
    description: Chunk-grid coordinate of the array's cell (0, ..., 0).
    range: integer
    multivalued: true
    minimum_cardinality: 1

  # -- root -----------------------------------------------------------------
  zv_version:
    description: >-
      Format version of the store.  This convention covers format 0.10.0,
      whose cell payloads are those of 0.9.4; 0.10.0 moved the metadata
      into this convention's layout, and 0.9.x stores migrate in place.
    equals_string: 0.10.0
  axes:
    range: Axis
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
    description: The store's coordinate axes; at least one is a space axis.
  chunk_shape:
    description: Physical chunk size per spatial axis (> 0).
    range: float
    multivalued: true
    minimum_cardinality: 1
  bounds:
    description: "Global vertex bounding box, `[[min...], [max...]]`."
    range: float
    array:
      dimensions:
        - alias: corner
          exact_cardinality: 2
        - alias: axis
          minimum_cardinality: 1
  geometry_types:
    multivalued: true
    pattern: ".+"
  links_convention: {range: LinksConvention}
  object_index_convention: {range: ObjectIndexConvention}
  cross_chunk_strategy: {range: CrossChunkStrategy}
  reduction_factor: {range: integer, minimum_value: 2}
  base_bin_shape:
    description: Level 0 bin edge lengths (> 0).
    range: float
    multivalued: true
    minimum_cardinality: 1
  cross_level_depth: {range: integer, minimum_value: -1}
  cross_level_storage: {range: CrossLevelStorage}
  format_capabilities:
    description: Optional feature tokens.  Open set; readers tolerate unknown tokens.
    multivalued: true
    pattern: ".+"
  required_capabilities:
    description: Capability tokens a reader MUST support to read the store at all.
    multivalued: true
    pattern: ".+"
  attribute_specs: {range: AttributeSpecs, inlined: true}
  shard_shape:
    description: >-
      Writer default: cells per shard per axis.  Each array's own zarr.json
      is the truth about that array.
    any_of:
      - range: integer
        minimum_value: 1
      - range: integer
        multivalued: true
        minimum_cardinality: 1
        minimum_value: 1
  octree_sharding:
    description: Writer default configuration of the octree sharding codec.  Needs `shard_shape`.
    range: OpenObject
    inlined: true
  manifest_layout: {range: ManifestLayout}
  manifest_block_dtype: {range: ManifestBlockDtype}
  coordinate_offset:
    range: float
    multivalued: true
    minimum_cardinality: 1
  crs:
    description: Not used from format 0.10.0 (see `proj:projjson`).
    range: OpenObject
    inlined: true

  # -- level ----------------------------------------------------------------
  level: {range: integer, minimum_value: 0}
  vertex_count: {range: integer, minimum_value: 0}
  arrays_present: {range: LevelArrayName, multivalued: true}
  fragments_tile:
    description: >-
      True when every chunk's fragments tile its vertex buffer.  Absent
      means false.
    range: boolean
  object_sparsity: {range: float, minimum_value: 0, maximum_value: 1}
  coarsening_method: {range: CoarseningMethod}
  chunk_dims: {multivalued: true}
  chunk_attribute_name: {}
  chunk_attribute_values:
    description: One label per leading-axis bin, in bin order.
    range: OpenValue
    multivalued: true
  preserves_object_ids: {range: boolean}
  inherited_num_objects: {range: integer, minimum_value: 0}
  shared_fragments: {range: boolean}
  parent_level:
    description: The level this one was coarsened from (absent or null at level 0).
    range: integer
    minimum_value: 0
  bin_shape:
    description: Bin edge lengths at this level (absent or null at level 0).
    range: float
    multivalued: true
    minimum_cardinality: 1
  bin_ratio:
    description: Per-axis bin size relative to level 0 (absent or null at level 0).
    range: float
    multivalued: true
    minimum_cardinality: 1
  presence: {range: PresenceState}
  link_fragments_aligned: {range: boolean}
  octree_chunks: {range: OpenObject, inlined: true}

  # -- arrays ---------------------------------------------------------------
  name:
    description: The attribute's name.
    pattern: ".+"
  dtype:
    description: NumPy dtype name of the rows inside a cell.
    pattern: ".+"
  encoding: {}
  compression_codec: {}
  shape: {range: integer, multivalued: true, minimum_value: 0}
  link_width: {range: integer, minimum_value: 1}
  level_delta: {range: integer}
  sid_ndim: {range: integer, minimum_value: 1}
  directed: {range: boolean}
  store: {range: CrossChunkStore}
  num_links: {range: integer, minimum_value: 0}
  num_physical_records: {range: integer, minimum_value: 0}
  element:
    description: >-
      What each record of a `delta = 0` links family is, when it is a
      volume-mesh cell rather than an edge or a polygon face: one element
      type (vertices in VTK order), or `mixed`.  Absent: an edge
      (`link_width` 2) or a polygon face (3 or more).
    range: LinkElement
  element_types:
    description: >-
      A mixed family's element types.  Records are as wide as the widest;
      a shorter cell repeats its last vertex, so a record's run of
      distinct vertices (4, 5, 6 or 8) names its type.
    range: VolumeElement
    multivalued: true
  offsets:
    description: >-
      The `link_width - 1` relative offsets naming the array, each of
      `sid_ndim` components, relative to the record's source chunk.
    range: integer
    array:
      dimensions:
        - alias: offset
        - alias: component
          minimum_cardinality: 1
  has_perm: {range: boolean}
  row_shape:
    description: "Tail dimensions of one row (`[]` for scalar rows)."
    range: integer
    multivalued: true
    minimum_value: 1
    maximum_cardinality: 1
  channel_names: {multivalued: true}
  channel_dtype: {}
  num_objects: {range: integer, minimum_value: 0}
  num_present: {range: integer, minimum_value: 0}
  layout: {range: ObjectIndexLayout}
  object_ids_sorted: {range: boolean}
  fill_sentinel_meaning: {equals_string: absent}
  num_groups: {range: integer, minimum_value: 0}
  group_ranges:
    description: "Group id to `[start, stop)` object-row range."
    range: OpenObject
    inlined: true
  parametric_types:
    range: ParametricType
    multivalued: true
    inlined: true
    inlined_as_list: false
  max_row_length: {range: integer, minimum_value: 0}
