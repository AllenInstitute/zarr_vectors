name: Convention schema

on:
  push:
    branches: [main]
    paths: ["convention/**", ".github/workflows/convention.yml"]
  pull_request:
    paths: ["convention/**", ".github/workflows/convention.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r convention/requirements.txt
      - name: schema.json is generated from the LinkML and handles the examples
        run: python convention/test_schema.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ajv strict mode compiles schema.json
        run: |
          npm install --no-save ajv@8.20.0
          node -e '
            const Ajv2020 = require("ajv/dist/2020").default;
            const ajv = new Ajv2020({strict: true, strictRequired: false, strictTuples: false});
            ajv.compile(require("./convention/schema.json"));
            console.log("compiled");
          '
